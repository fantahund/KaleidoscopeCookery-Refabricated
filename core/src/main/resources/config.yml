# KaleidoscopeCookery – Hauptkonfiguration
# Nach Änderungen: /kc reload (Webserver-Einstellungen erst nach einem Neustart)

resource-pack:
  # Pack beim Betreten an die Spieler schicken
  enabled: true
  # Spieler müssen das Pack annehmen (sonst werden sie gekickt)
  required: true
  # Externe Download-URL. Leer = eingebauter Mini-Webserver liefert das Pack aus dem Plugin aus.
  external-url: ""
  # Eingebauter Webserver: Adresse/Port, an die er sich bindet ...
  bind-address: 0.0.0.0
  port: 8163
  # ... und die Adresse, unter der die Spieler ihn erreichen (für einen lokalen Testserver: 127.0.0.1)
  public-host: 127.0.0.1

# Schneidebrett: Geschnitten wird per Linksklick mit einem Küchenmesser (wie im Mod).
# Schnitte pro Hieb je Werkzeug (Item-ID). Werkzeuge, die hier fehlen, können nicht schneiden und lösen auch keine Öl-Drops aus.
# Mod: 1 Schnitt pro Hieb (mit "Schnelles Messer" I/II: 2/4).
cutting:
  tools:
    kaleidoscope_cookery:copper_kitchen_knife: 1
    kaleidoscope_cookery:iron_kitchen_knife: 1
    kaleidoscope_cookery:gold_kitchen_knife: 1
    kaleidoscope_cookery:diamond_kitchen_knife: 1
    kaleidoscope_cookery:netherite_kitchen_knife: 1
  # Wahrscheinlichkeit, dass ein Schnitt 1 Haltbarkeit kostet (Mod: 25 %)
  durability-chance: 0.25
  # Mindestabstand zwischen zwei Schnitten in Ticks (gegen Auto-Klicker)
  cooldown-ticks: 4

# Öl: Diese Tiere lassen Öl fallen, wenn sie mit einem Küchenmesser (siehe cutting.tools) getötet werden.
# Menge: min..max, Plünderung erhöht pro Stufe um 0..1.
oil-drops:
  enabled: true
  min: 1
  max: 2
  entities:
    - PIG
    - HOGLIN
    - PIGLIN
    - PIGLIN_BRUTE
    - ZOGLIN
    - ZOMBIFIED_PIGLIN

food:
  # Vanilla-Essen abschwächen: Hunger und Sättigung in Prozent (Gerichte aus den Kochstationen bleiben unverändert)
  vanilla:
    enabled: true
    default-percent: 50
    # Abweichungen je Item (Material-Name)
    items:
      GOLDEN_CARROT: 60
      GOLDEN_APPLE: 100
      ENCHANTED_GOLDEN_APPLE: 100
      SUSPICIOUS_STEW: 100
      HONEY_BOTTLE: 100
      CHORUS_FRUIT: 100
      DRIED_KELP: 70
      CAKE: 60

# Abgeschaltete Rezepte: Sie bleiben in recipes.yml, werden aber nicht geladen und stehen nicht im Kochbuch.
# Rezept-ID wie in recipes.yml (bzw. bei Addons deren recipes.yml), mit "*" am Ende für alle mit diesem Anfang,
# z. B. "kaleidoscope_cookery:millstone/*" (alle Mühlen-Rezepte) oder "kaleidoscope_cookery:bamboo_tray/drying/*".
disabled-recipes:
  # Ölblock und Strohballen herstellen (zurück in Öl bzw. Reisrispen geht weiter)
  - "kaleidoscope_cookery:oil_block"
  - "kaleidoscope_cookery:straw_block"
  # Mühle und Bambustablett: nur Mod-Items herstellen, Rezepte mit Vanilla-Ergebnis abgeschaltet (Zeile löschen = wieder an)
