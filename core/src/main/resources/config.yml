# KaleidoscopeCookery – Hauptkonfiguration
# Nach Änderungen: /kc reload
# Die Resourcepacks verschickt das Plugin KaleidoscopePack.

# Schneidebrett: Geschnitten wird per Linksklick mit einem Küchenmesser (wie im Mod).
# Schnitte pro Hieb je Werkzeug (Item-ID). Werkzeuge, die hier fehlen, können nicht schneiden und lösen auch keine Öl-Drops aus.
# Mod: 1 Schnitt pro Hieb (mit "Schnelles Messer" I/II: 2/4).
cutting:
  tools:
    # Steinmesser: Vorlage für die Messer-Gussform (KaleidoscopeSmithing)
    kaleidoscope_cookery:stone_kitchen_knife: 1
    kaleidoscope_cookery:copper_kitchen_knife: 1
    kaleidoscope_cookery:iron_kitchen_knife: 1
    kaleidoscope_cookery:gold_kitchen_knife: 1
    kaleidoscope_cookery:diamond_kitchen_knife: 1
    kaleidoscope_cookery:netherite_kitchen_knife: 1
  # Wahrscheinlichkeit, dass ein Schnitt 1 Haltbarkeit kostet (Mod: 25 %)
  durability-chance: 0.25
  # Mindestabstand zwischen zwei Schnitten in Ticks (gegen Auto-Klicker)
  cooldown-ticks: 4

# Öl: Diese Tiere lassen Öl fallen, wenn sie mit einem Küchenmesser (siehe cutting.tools) getötet werden.
# Menge: min..max, Plünderung erhöht pro Stufe um 0..1.
oil-drops:
  enabled: true
  min: 1
  max: 2
  entities:
    - PIG
    - HOGLIN
    - PIGLIN
    - PIGLIN_BRUTE
    - ZOGLIN
    - ZOMBIFIED_PIGLIN

food:
  # Vanilla-Essen abschwächen: Hunger und Sättigung in Prozent (Gerichte aus den Kochstationen bleiben unverändert)
  vanilla:
    enabled: true
    default-percent: 50
    # Abweichungen je Item (Material-Name)
    items:
      GOLDEN_CARROT: 60
      GOLDEN_APPLE: 100
      ENCHANTED_GOLDEN_APPLE: 100
      SUSPICIOUS_STEW: 100
      HONEY_BOTTLE: 100
      CHORUS_FRUIT: 100
      DRIED_KELP: 70
      CAKE: 60

  # Mod-Gerichte mit angepassten Nährwerten: Prozent von Hunger und Sättigung des Mods (100 = wie im Mod).
  # Bereits vorhandene Items behalten ihre alten Werte, neu gekochte bekommen die angepassten.
  dishes: {}
    # (die Gerichte der Kochstationen haben ihre Werte jetzt unter cooking-skill.dishes)

# Spender bedienen Stationen wie im Mod: Ölkanne, Bambustablett und Teekanne hinstellen, Zutaten aufs Schneidebrett
# legen und mit Küchenmessern schneiden. false = Spender verhalten sich wie in Vanilla.
dispensers: false

# Abgeschaltete Rezepte: Sie bleiben in recipes.yml, werden aber nicht geladen und stehen nicht im Kochbuch.
# Rezept-ID wie in recipes.yml (bzw. bei Addons deren recipes.yml), mit "*" am Ende für alle mit diesem Anfang,
# z. B. "kaleidoscope_cookery:millstone/*" (alle Mühlen-Rezepte) oder "kaleidoscope_cookery:bamboo_tray/drying/*".
disabled-recipes:
  # Küchenmesser ab Eisen, Wok und Suppentopf werden in KaleidoscopeSmithing gegossen/geschmiedet
  - "kaleidoscope_cookery:iron_kitchen_knife"
  - "kaleidoscope_cookery:gold_kitchen_knife"
  - "kaleidoscope_cookery:diamond_kitchen_knife"
  - "kaleidoscope_cookery:netherite_kitchen_knife_smithing"
  - "kaleidoscope_cookery:pot"
  - "kaleidoscope_cookery:stockpot"
  # Ölblock und Strohballen herstellen (zurück in Öl bzw. Reisrispen geht weiter)
  - "kaleidoscope_cookery:oil_block"
  - "kaleidoscope_cookery:straw_block"
  # Möbel und Deko ohne Funktion (Stühle, Kochhocker, Tische, Langbank, Acht-Unsterblichen-Tisch, Laterne, Tee-Banner)
  - "kaleidoscope_cookery:chair_*"
  - "kaleidoscope_cookery:cook_stool_*"
  - "kaleidoscope_cookery:table_*"
  - "kaleidoscope_cookery:long_bench"
  - "kaleidoscope_cookery:eight_immortals_table"
  - "kaleidoscope_cookery:red_lantern"
  - "kaleidoscope_cookery:tea_banner"
  # Mühle und Bambustablett: nur Mod-Items herstellen, Rezepte mit Vanilla-Ergebnis abgeschaltet (Zeile löschen = wieder an)
