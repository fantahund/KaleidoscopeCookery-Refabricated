# Koch-Level (gemeinsam für Cookery und Grilling, gespeichert im KaleidoscopeCore). Gerichte werden nach ihrem Wert
# (Hunger, Sättigung, Effekte) in 5 Stufen freigeschaltet: Koch-Stufe 1, 11, 21, 31, 41. XP von Stufe L auf L+1 = base-xp * growth^(L-1), max. Stufe 50.
cooking-skill:
  base-xp: 100
  growth: 1.1
  xp:
    # Wok-Gericht (mal Qualität: schlecht 0.5, normal 1, sehr gut 1.5, ausgezeichnet 2)
    pot: 12
    # Suppentopf pro Portion (mal Qualität)
    stockpot: 4
    # Dampfgarer pro gegartem Stück
    steamer: 3
    # Schneidebrett pro fertig geschnittener Zutat
    chopping-board: 1
    # Dönerspieß pro gegartem Stück
    shawarma-spit: 1
    # Teekanne: pro eingegossener Tasse
    teapot: 2
    # Grilling: gegrillter Spieß, fertig aufgespießter Spieß
    grill: 8
    skewer: 2
  perks:
    # Chance pro Stufe, dass ein Gericht aus Wok/Suppentopf eine Qualitätsstufe besser wird (Stufe 50: 30 %)
    better-quality-per-level: 0.006
    # Chance pro Stufe auf eine Extra-Portion beim Herausnehmen (Stufe 50: 15 %)
    extra-portion-per-level: 0.003
    # Gerichte tragen den Rang ihres Kochs (alle 10 Stufen): pro Rang sättigen sie so viel mehr (Sternekoch: +40 %)
    saturation-per-rank: 0.10
  # Stufe der Effektdauer je Koch-Stufe in Prozent der Mod-Werte
  effect-percent:
    1: 50
    11: 75
    21: 100
    31: 125
    41: 150
  # Gerichte: nötige Koch-Stufe sowie Hunger und Sättigung gesamt (bei Tellern über alle Bissen).
  # Fehlende Werte bleiben wie im Mod; nicht gelistete Gerichte sind ab Stufe 1 kochbar.
  dishes:
    "kaleidoscope_cookery:brown_mushroom_pot_soup": {level: 1, nutrition: 6, saturation: 4.8}
