# KaleidoscopeCookery – Hauptkonfiguration
# Nach Änderungen: /kc reload (Webserver-Einstellungen erst nach einem Neustart)

resource-pack:
  # Pack beim Betreten an die Spieler schicken
  enabled: true
  # Spieler müssen das Pack annehmen (sonst werden sie gekickt)
  required: true
  # Externe Download-URL. Leer = eingebauter Mini-Webserver liefert das Pack aus dem Plugin aus.
  external-url: ""
  # Eingebauter Webserver: Adresse/Port, an die er sich bindet ...
  bind-address: 0.0.0.0
  port: 8163
  # ... und die Adresse, unter der die Spieler ihn erreichen (für einen lokalen Testserver: 127.0.0.1)
  public-host: 127.0.0.1

# Schneidebrett: Geschnitten wird per Linksklick mit einem Schwert oder Küchenmesser.
# Schnitte pro Hieb je Werkzeug (Item-ID). Werkzeuge, die hier fehlen, können nicht schneiden.
# Im Mod schafft ein Küchenmesser 1 Schnitt (mit "Schnelles Messer" 2 bzw. 4).
cutting:
  tools:
    minecraft:wooden_sword: 1
    minecraft:stone_sword: 1
    minecraft:copper_sword: 1
    minecraft:golden_sword: 1
    minecraft:iron_sword: 1
    minecraft:diamond_sword: 2
    minecraft:netherite_sword: 2
    kaleidoscope_cookery:iron_kitchen_knife: 2
    kaleidoscope_cookery:gold_kitchen_knife: 2
    kaleidoscope_cookery:diamond_kitchen_knife: 3
    kaleidoscope_cookery:netherite_kitchen_knife: 4
  # Wahrscheinlichkeit, dass ein Schnitt 1 Haltbarkeit kostet (Mod: 25 %)
  durability-chance: 0.25
  # Mindestabstand zwischen zwei Schnitten in Ticks (gegen Auto-Klicker)
  cooldown-ticks: 4

# Öl: Diese Tiere lassen Öl fallen, wenn sie mit einem Schneidewerkzeug (siehe cutting.tools) getötet werden.
# Menge: min..max, Plünderung erhöht pro Stufe um 0..1.
oil-drops:
  enabled: true
  min: 1
  max: 2
  entities:
    - PIG
    - HOGLIN
    - PIGLIN
    - PIGLIN_BRUTE
    - ZOGLIN
    - ZOMBIFIED_PIGLIN
