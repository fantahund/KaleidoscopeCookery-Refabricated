# KaleidoscopeGrilling – Einstellungen

# Heißes Essen (烟火气): frisch gekochte Gerichte sind eine Zeit lang heiß.
# Beim Essen eines heißen Gerichts halten neu bekommene Effekte doppelt so lange und die Sättigung steigt stärker.
hot:
  enabled: true
  # Sättigungs-Gewinn heißer Gerichte in Prozent (Mod: 125, 100–200)
  saturation-percent: 125
  # So lange bleiben Gerichte aus dem Wok heiß (Sekunden, Mod: normales Öl 60 s)
  wok-seconds: 60
  # So lange bleiben Suppen aus dem Suppentopf heiß (Sekunden, Mod: 60 s)
  stockpot-seconds: 60
